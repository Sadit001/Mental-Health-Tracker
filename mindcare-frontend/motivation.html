<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Begin Your Wellness Journey | MindCare</title>
    <link rel="stylesheet" href="motivation-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="blur-overlay"></div>
    <div class="container">
        <div class="motivation-card">
            <div class="quote-icon">
                <i class="fas fa-quote-left"></i>
            </div>
            <p class="motivation-text" id="motivationText">
                "You don't have to control your thoughts. You just have to stop letting them control you."
            </p>
            <div class="author">- Dan Millman</div>
            
            <div class="button-group">
                <button id="loginBtn" class="auth-button" onclick="window.location.href='login.html'">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <button id="registerBtn" class="auth-button secondary" onclick="window.location.href='register.html'">
                    <i class="fas fa-user-plus"></i> Register
                </button>
            </div>
        </div>
        
        <div class="floating-shapes">
            <div class="shape circle"></div>
            <div class="shape triangle"></div>
        </div>
    </div>

    <script src="motivation-script.js"></script>
</body>
</html>
