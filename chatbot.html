<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCare | Emotional Support Chatbot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="chatbot.css">
</head>
<body>
    <div class="chatbot-container">
        <div class="chatbot-header">
            <div class="chatbot-avatar">
                <i class="fas fa-heartbeat"></i>
            </div>
            <div class="chatbot-info">
                <h3>MindCare Assistant</h3>
                <p>Online</p>
            </div>
            <div class="chatbot-controls">
                <button id="minimize-btn"><i class="fas fa-minus"></i></button>
                <button id="close-btn"><i class="fas fa-times"></i></button>
            </div>
        </div>
        
        <div class="chatbot-messages" id="chat-messages">
            <!-- Messages will appear here -->
        </div>
        
        <div class="chatbot-input-area">
            <div class="typing-indicator" id="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <input type="text" id="user-input" placeholder="How are you feeling today?" autocomplete="off">
            <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
            <button id="mic-btn"><i class="fas fa-microphone"></i></button>
        </div>
    </div>

    <script src="chatbot.js"></script>
</body>
</html>
