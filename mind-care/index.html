<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCare | Mental Health Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="blur-overlay"></div>
    <nav>
        <div class="logo">
            <i class="fas fa-brain"></i>
            <span>MindCare</span>
        </div>
        <ul class="nav-links">
            <li><a href="#">Features</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <main>
        <div class="hero-content">
            <h1>Your Journey to Better Mental Health Starts Here</h1>
            <p>Track your mood, build healthy habits, and prioritize self-care with our intuitive wellness tracker.</p>
            <button id="getStartedBtn" class="cta-button">
                Get Started <i class="fas fa-arrow-right"></i>
            </button>
        </div>
        <div class="hero-image">
            <img src="https://illustrations.popsy.co/amber/digital-nomad.svg" alt="Mental health illustration">
        </div>
    </main>

    <div class="floating-shapes">
        <div class="shape circle"></div>
        <div class="shape triangle"></div>
        <div class="shape square"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
